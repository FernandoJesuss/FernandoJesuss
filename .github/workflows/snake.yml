name: generate profile snake animation

on:
  schedule:
    - cron: "0 0 * * *"   # roda uma vez por dia
  push:
    branches:
      - main
  workflow_dispatch: {}    # permite rodar manualmente pela aba Actions

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate snake svg (dark e light)
        uses: Platane/snk@v3
        with:
          github_user_name: FernandoJesuss
          outputs: |
            dist/snake-dark.svg?palette=github-dark
            dist/snake-light.svg?palette=github-light

      - name: publicar no branch "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
